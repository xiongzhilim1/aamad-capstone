[project]
name = "peers-circles-backend"
version = "0.1.0"
description = "FastAPI + CrewAI backend for the Peers & Circles capstone (see project-context/1.define/sad.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "crewai[anthropic]>=1.15.41",
    "fastapi[standard]>=0.163.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
