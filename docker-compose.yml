# Local development stack (SAD §5). Requires Docker Desktop.
# Frontend runs outside compose: `cd frontend && npm run dev` (proxies /api to :8000).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: peers
      POSTGRES_PASSWORD: peers
      POSTGRES_DB: peers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peers"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://peers:peers@db:5432/peers
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
