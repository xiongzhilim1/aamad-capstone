<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-journey-title core-journey-desc" id="core-journey-root">
      <title id="core-journey-title">From a meetup to an ongoing circle</title>
      <desc id="core-journey-desc">Hypothesised journey of a new entrepreneur across six stages, from meeting people at a meetup to joining a circle, with sentiment dipping after the event when no contacts were exchanged and reconnection waits for the host to confirm attendance.</desc>
  <defs>
      <style>#core-journey-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #core-journey-root { font-family: var(--font-sans); color: var(--color-ink); }
      #core-journey-root .scroll { overflow-x: auto; }</style>
  </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Stage headers -->
      <text x="148" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 1</text>
      <text x="148" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Meet at a meetup</text>
      <text x="332" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 2</text>
      <text x="332" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">After the event</text>
      <text x="516" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 3</text>
      <text x="516" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Set up profile</text>
      <text x="700" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text>
      <text x="700" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Discover</text>
      <text x="884" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text>
      <text x="884" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Connect</text>
      <text x="1068" y="40" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 6</text>
      <text x="1068" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Join a circle</text>

      <!-- Sentiment band -->
      <line x1="64" y1="100" x2="1160" y2="100" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <line x1="64" y1="180" x2="1160" y2="180" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <line x1="64" y1="260" x2="1160" y2="260" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="56" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.10em">HIGH</text>
      <text x="56" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.10em">NEUTRAL</text>
      <text x="56" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.10em">LOW</text>

      <polyline points="148,100 332,220" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="332,220 516,180 700,140 884,100 1068,100" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="148" cy="100" r="5" fill="#4f5d75"/>
      <circle cx="332" cy="220" r="5" fill="#bf4520"/>
      <circle cx="516" cy="180" r="5" fill="#4f5d75"/>
      <circle cx="700" cy="140" r="5" fill="#4f5d75"/>
      <circle cx="884" cy="100" r="5" fill="#4f5d75"/>
      <circle cx="1068" cy="100" r="5" fill="#4f5d75"/>

      <!-- Row separators -->
      <line x1="64" y1="280" x2="1160" y2="280" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <line x1="64" y1="376" x2="1160" y2="376" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <line x1="64" y1="424" x2="1160" y2="424" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

      <!-- Row labels -->
      <text x="56" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">ACTIONS</text>
      <text x="56" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">SURFACE</text>
      <text x="56" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">STORIES</text>

      <!-- Actions -->
      <text x="148" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Chats with founders</text>
      <text x="332" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Wants to reconnect</text>
      <text x="516" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Writes, reviews AI draft</text>
      <text x="700" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Asks for suggestions</text>
      <text x="884" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Connects, shares contacts</text>
      <text x="1068" y="304" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Joins for ongoing support</text>

      <!-- Pain markers (trough only) -->
      <rect x="248" y="316" width="168" height="16" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="0.8" stroke-dasharray="3,3" fill-opacity="0.08" stroke-opacity="0.50"/>
      <text x="332" y="328" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">NO CONTACTS SWAPPED</text>
      <rect x="248" y="336" width="168" height="16" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="0.8" stroke-dasharray="3,3" fill-opacity="0.08" stroke-opacity="0.50"/>
      <text x="332" y="348" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.02em">WAITS FOR HOST TO CONFIRM</text>

      <!-- Surfaces -->
      <text x="148" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in person · cafe</text>
      <text x="332" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">event · After the event</text>
      <text x="516" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">onboarding + assistant</text>
      <text x="700" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Discover</text>
      <text x="884" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Connections</text>
      <text x="1068" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">circle page</text>

      <!-- Stories -->
      <text x="148" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-014</text>
      <text x="332" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-004 · US-015</text>
      <text x="516" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-023 · US-024</text>
      <text x="700" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-005 · US-006</text>
      <text x="884" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-007 to US-009</text>
      <text x="1068" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">US-011</text>

      <!-- Legend -->
      <line x1="40" y1="496" x2="1160" y2="496" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="40" y1="530" x2="56" y2="530" stroke="#4f5d75" stroke-width="1.5"/>
      <circle cx="48" cy="530" r="3" fill="#4f5d75"/>
      <text x="64" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Sentiment (hypothesis, not research)</text>
      <line x1="260" y1="530" x2="276" y2="530" stroke="#bf4520" stroke-width="1.5"/>
      <circle cx="268" cy="530" r="3" fill="#bf4520"/>
      <text x="284" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Trough stage</text>
      <rect x="424" y="526" width="16" height="8" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="0.8" stroke-dasharray="3,3" fill-opacity="0.08" stroke-opacity="0.50"/>
      <text x="448" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Pain marker</text>
    </svg>
