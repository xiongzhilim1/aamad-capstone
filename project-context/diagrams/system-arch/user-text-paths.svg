<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="user-text-paths-title user-text-paths-desc" id="user-text-paths-root">
      <title id="user-text-paths-title">How user-written text reaches each prompt</title>
      <desc id="user-text-paths-desc">Participant A's free text goes into the profile assistant prompt as data and comes back as a draft; once A accepts it, the saved tags and bio are stored and later copied into Participant B's suggestion prompt as candidate data.</desc>
      <defs>
      <style>#user-text-paths-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #user-text-paths-root { font-family: var(--font-sans); color: var(--color-ink); }
      #user-text-paths-root .scroll { overflow-x: auto; }</style>
        <pattern id="user-text-paths-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="user-text-paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="user-text-paths-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#user-text-paths-dots)" opacity="0.55"/>

      <!-- Row labels -->
      <text x="40" y="40" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">1 · PROFILE ASSISTANT — A'S OWN TEXT, A'S OWN PROMPT</text>
      <text x="40" y="340" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">2 · SUGGESTIONS — A'S SAVED TEXT INSIDE B'S PROMPT</text>

      <!-- Arrows -->
      <!-- A -> assistant builder -->
      <line x1="184" y1="128" x2="264" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <!-- assistant builder -> assistant model -->
      <line x1="424" y1="128" x2="504" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <!-- assistant model -> A (draft) -->
      <path d="M 584,96 V 72 Q 584,64 576,64 H 120 Q 112,64 112,72 V 96" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#user-text-paths-arrow)"/>
      <!-- A accepts -> profile store -->
      <path d="M 112,160 V 248 Q 112,256 120,256 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <!-- profile store -> suggestion builder (focal) -->
      <path d="M 840,288 V 312 Q 840,320 832,320 H 352 Q 344,320 344,328 V 352" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#user-text-paths-arrow-accent)"/>
      <!-- B -> suggestion builder -->
      <line x1="184" y1="384" x2="264" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <!-- suggestion builder -> suggestion model -->
      <line x1="424" y1="384" x2="504" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <!-- suggestion model -> B (reasons) -->
      <path d="M 584,416 V 440 Q 584,448 576,448 H 120 Q 112,448 112,440 V 416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#user-text-paths-arrow)"/>

      <!-- Arrow labels -->
      <rect x="192" y="110" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FREE TEXT</text>

      <rect x="436" y="110" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AS DATA</text>

      <rect x="316" y="46" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="55" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DRAFT TAGS</text>

      <rect x="560" y="238" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">A ACCEPTS</text>

      <rect x="548" y="302" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="311" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">A'S TAGS + BIO</text>

      <rect x="192" y="366" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUGGEST</text>

      <rect x="436" y="366" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT</text>

      <rect x="316" y="430" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REASONS</text>

      <!-- Node: Participant A -->
      <rect x="40" y="96" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="96" width="144" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="104" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="68" y="113" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="112" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Participant A</text>
      <text x="112" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes about self</text>

      <!-- Node: Assistant prompt builder -->
      <rect x="264" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="272" y="104" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="288" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
      <text x="344" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prompt builder</text>
      <text x="344" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cap 1,500 · delimit</text>

      <!-- Node: Profile assistant model -->
      <rect x="504" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="96" width="160" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="512" y="104" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="532" y="113" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="584" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Profile assistant</text>
      <text x="584" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">W21 · drafts tags</text>

      <!-- Node: Profile store -->
      <rect x="760" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="224" width="160" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="768" y="232" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="780" y="241" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="840" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Profile store</text>
      <text x="840" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tags · bio · visibility</text>

      <!-- Node: Participant B -->
      <rect x="40" y="352" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="352" width="144" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="360" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="68" y="369" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="112" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Participant B</text>
      <text x="112" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">presses Suggest</text>

      <!-- Node: Suggestion prompt builder (focal) -->
      <rect x="264" y="352" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="352" width="160" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="272" y="360" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="288" y="369" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
      <text x="344" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prompt builder</text>
      <text x="344" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">B + ≤50 candidates</text>

      <!-- Node: Suggestion model -->
      <rect x="504" y="352" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="352" width="160" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="512" y="360" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="532" y="369" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
      <text x="584" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Suggestion model</text>
      <text x="584" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">W07 · ranks + reasons</text>

      <!-- Callout -->
      <text x="704" y="380" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">A writes once. A's saved words</text>
      <text x="704" y="398" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">ride into every viewer's prompt.</text>

      <!-- Legend -->
      <line x1="40" y1="488" x2="960" y2="488" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="520" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <text x="60" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Person</text>

      <rect x="128" y="520" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">App code</text>

      <rect x="224" y="520" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <text x="244" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Model call</text>

      <rect x="324" y="520" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <text x="344" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>

      <line x1="404" y1="526" x2="432" y2="526" stroke="#bf4520" stroke-width="1.4" marker-end="url(#user-text-paths-arrow-accent)"/>
      <text x="440" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Someone else's text entering a prompt</text>

      <line x1="640" y1="526" x2="668" y2="526" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#user-text-paths-arrow)"/>
      <text x="676" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Request / save</text>

      <line x1="776" y1="526" x2="804" y2="526" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#user-text-paths-arrow)"/>
      <text x="812" y="528" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Result back to user</text>
    </svg>
