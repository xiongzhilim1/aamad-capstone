<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control register · Enforcement layers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · system-arch · Control Register</p>
    <h1>Where each control is enforced on a model request</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-layers-title control-layers-desc">
      <title id="control-layers-title">Where each control is enforced on a model request</title>
      <desc id="control-layers-desc">Five enforcement layers a model request passes through, from session checks and prompt assembly to crew configuration, output checks and human review, each listing its control register IDs and who enforces it.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Direction column -->
      <text x="48" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">REQUEST</text>
      <line x1="80" y1="80" x2="80" y2="392" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="76,392 84,392 80,400" fill="#4f5d75"/>
      <text x="44" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">EFFECT</text>

      <!-- Stack edges -->
      <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L1 Session & API -->
      <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
      <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L1</text>
      <text x="184" y="118" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Session &amp; API</text>
      <text x="400" y="117" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">CR-011 actor · CR-010 rate + spend · CR-014 publish gate</text>
      <text x="940" y="117" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">code · every call</text>

      <!-- L2 Prompt assembly (focal) -->
      <rect x="120" y="144" width="840" height="64" fill="rgba(191,69,32,0.08)"/>
      <rect x="120" y="144" width="840" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
      <text x="140" y="180" fill="#bf4520" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L2</text>
      <text x="184" y="182" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Prompt assembly</text>
      <text x="400" y="181" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">CR-001 eligible only · CR-002 allowlist · CR-003 delimit</text>
      <text x="940" y="181" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">code · before call</text>

      <!-- L3 Crew config -->
      <rect x="120" y="208" width="840" height="64" fill="#f5f5f5"/>
      <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L3</text>
      <text x="184" y="246" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Crew config</text>
      <text x="400" y="245" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">CR-008 zero tools · CR-009 no write path</text>
      <text x="940" y="245" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">code · at boot</text>

      <!-- L4 Output checks -->
      <rect x="120" y="272" width="840" height="64" fill="#ececec"/>
      <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L4</text>
      <text x="184" y="310" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Output checks</text>
      <text x="400" y="309" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">CR-005 schema · CR-006 grounding · CR-007, CR-015 leaks</text>
      <text x="940" y="309" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">code · after call</text>

      <!-- L5 Human review -->
      <rect x="120" y="336" width="840" height="64" fill="#ececec"/>
      <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">L5</text>
      <text x="184" y="374" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Human review</text>
      <text x="400" y="373" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">user accepts drafts · admin approves every event</text>
      <text x="940" y="373" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">human · before effect</text>

      <!-- Caption -->
      <text x="120" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="224" y="448" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Privacy is decided before the model sees anything. Everything fails closed except CR-004 ranking skew and CR-013 logging.</text>
      <text x="120" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">MEASURED</text>
      <text x="224" y="472" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">CR-004 injection skew and CR-012 fairness are eval-gated before release, not checked per request.</text>
    </svg>
    </div>
  </div>
</body>
</html>
