<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reference-architecture-title reference-architecture-desc" id="reference-architecture-root">
      <title id="reference-architecture-title">Suggestion request: one augmented call</title>
      <desc id="reference-architecture-desc">A suggestion request passes through the server, which queries eligible candidates live from the database, makes one tool-free model call through a one-agent crew, validates the JSON before returning it, and falls back to filter discovery on failure.</desc>
      <defs>
      <style>#reference-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #reference-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #reference-architecture-root .scroll { overflow-x: auto; }</style>
        <pattern id="reference-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="reference-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="reference-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="reference-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#reference-architecture-dots)" opacity="0.55"/>

      <!-- Zone: server trust boundary -->
      <rect x="224" y="40" width="640" height="512" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="496" y="44" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SERVER · TRUSTED</text>

      <!-- Arrows -->
      <!-- UI -> API -->
      <line x1="184" y1="232" x2="248" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#reference-architecture-arrow-link)"/>
      <!-- API -> Candidate query -->
      <line x1="392" y1="232" x2="456" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reference-architecture-arrow)"/>
      <!-- Candidate query -> Database -->
      <line x1="528" y1="200" x2="528" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reference-architecture-arrow)"/>
      <!-- Candidate query -> Crew (headline) -->
      <line x1="600" y1="232" x2="664" y2="232" stroke="#bf4520" stroke-width="1.4" marker-end="url(#reference-architecture-arrow-accent)"/>
      <!-- Crew -> LLM provider -->
      <line x1="840" y1="232" x2="904" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#reference-architecture-arrow-link)"/>
      <!-- Crew -> Validator -->
      <line x1="752" y1="264" x2="752" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#reference-architecture-arrow)"/>
      <!-- API -> Filter discovery fallback (vertical, uninterrupted) -->
      <line x1="344" y1="264" x2="344" y2="456" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reference-architecture-arrow)"/>
      <!-- Validator -> API return (dashed, bridges the fallback line) -->
      <path d="M 664,368 H 352 a 8,8 0 0,0 -16,0 H 304 Q 296,368 296,360 V 264" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reference-architecture-arrow)"/>

      <!-- Arrow labels -->
      <rect x="188" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="223" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUGGEST</text>

      <rect x="396" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VIEWER</text>

      <rect x="538" y="158" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="562" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LIVE SQL</text>

      <rect x="604" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="223" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">≤50 · ≤20</text>

      <rect x="852" y="214" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="874" y="223" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1 CALL</text>

      <rect x="762" y="294" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="782" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>

      <rect x="468" y="350" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECKED TOP-N</text>

      <rect x="354" y="408" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ON FAIL</text>

      <!-- Node: Participant UI -->
      <rect x="40" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="144" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <rect x="48" y="208" width="24" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="60" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="112" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Participant</text>
      <text x="112" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web app</text>

      <!-- Node: Suggest API -->
      <rect x="248" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="208" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="270" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="320" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Suggest API</text>
      <text x="320" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">session actor</text>

      <!-- Node: Candidate query -->
      <rect x="456" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="464" y="208" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="480" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">W06</text>
      <text x="528" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Candidate query</text>
      <text x="528" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">eligible · minimised</text>

      <!-- Node: Database -->
      <rect x="456" y="64" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="64" width="144" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="464" y="72" width="24" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="476" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="528" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Database</text>
      <text x="528" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">consent · blocks</text>

      <!-- Node: Crew (focal) -->
      <rect x="664" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="200" width="176" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="672" y="208" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="692" y="217" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">W07</text>
      <text x="752" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Suggestion crew</text>
      <text x="752" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 agent · 1 task · 0 tools</text>

      <!-- Node: Validator -->
      <rect x="664" y="336" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="336" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="672" y="344" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="688" y="353" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">W08</text>
      <text x="752" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Schema + grounding</text>
      <text x="752" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Task.guardrail</text>

      <!-- Node: Filter discovery fallback -->
      <rect x="272" y="456" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="456" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="280" y="464" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="296" y="473" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">W05</text>
      <text x="344" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Filter discovery</text>
      <text x="344" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fallback · no model</text>

      <!-- Node: LLM provider (external) -->
      <rect x="904" y="200" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="904" y="200" width="136" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <rect x="912" y="208" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
      <text x="926" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="972" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">LLM provider</text>
      <text x="972" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">model in step 3</text>

      <!-- Callout -->
      <text x="880" y="440" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">≤2 model calls per request,</text>
      <text x="880" y="458" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">≤ US$0.05 each request.</text>

      <!-- Legend -->
      <line x1="40" y1="568" x2="1040" y2="568" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="598" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <text x="60" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Model step</text>

      <rect x="148" y="598" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">App code</text>

      <rect x="248" y="598" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <text x="268" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>

      <rect x="324" y="598" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
      <text x="344" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External</text>

      <rect x="420" y="598" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <text x="440" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">User</text>

      <line x1="500" y1="604" x2="528" y2="604" stroke="#bf4520" stroke-width="1.4" marker-end="url(#reference-architecture-arrow-accent)"/>
      <text x="536" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Data the model sees</text>

      <line x1="664" y1="604" x2="692" y2="604" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#reference-architecture-arrow-link)"/>
      <text x="700" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP call</text>

      <line x1="784" y1="604" x2="812" y2="604" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#reference-architecture-arrow)"/>
      <text x="820" y="606" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return / fallback</text>
    </svg>
