<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="suggestion-sequence-title suggestion-sequence-desc" id="suggestion-sequence-root">
      <title id="suggestion-sequence-title">Suggestion request: checks before and after one model call</title>
      <desc id="suggestion-sequence-desc">Sequence of a suggestion request. The backend checks the rate limit and spend cap, queries eligible candidates live, kicks off the one-agent crew once, and either returns guardrail-checked items after re-checking eligibility, or falls back to filter discovery. A trace record is written in both cases.</desc>
      <defs>
      <style>#suggestion-sequence-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #suggestion-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #suggestion-sequence-root .scroll { overflow-x: auto; }</style>
        <pattern id="suggestion-sequence-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="suggestion-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="suggestion-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="suggestion-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="suggestion-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#suggestion-sequence-dots)" opacity="0.55"/>
      <line x1="120" y1="104" x2="120" y2="620" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="384" y1="104" x2="384" y2="620" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="648" y1="104" x2="648" y2="620" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <line x1="912" y1="104" x2="912" y2="620" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
      <rect x="96" y="292" width="880" height="248" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
      <rect x="96" y="292" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
      <text x="116" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="148" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">[schema-valid output within 20 s]</text>
      <line x1="104" y1="436" x2="968" y2="436" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
      <text x="108" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">[else: timeout, refusal, second schema miss]</text>
      <rect x="380" y="140" width="8" height="456" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
      <rect x="908" y="260" width="8" height="72" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
      <line x1="120" y1="144" x2="380" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow-link)"/>
      <rect x="153" y="128" width="193" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250.0" y="137" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">1  POST /suggestions (session cookie)</text>
      <line x1="388" y1="180" x2="648" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="421" y="164" width="193" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518.0" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">2  preflight: 10/hour, spend &lt; cap</text>
      <line x1="388" y1="220" x2="648" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="431" y="204" width="173" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518.0" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">3  W06 live candidates (≤50, ≤20)</text>
      <line x1="388" y1="264" x2="908" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="546" y="248" width="203" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648.0" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">4  kickoff(payload): one call, ≤1 retry</text>
      <line x1="908" y1="332" x2="388" y2="332" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="551" y="316" width="193" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648.0" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">5  W08-checked items (Task.guardrail)</text>
      <line x1="388" y1="368" x2="648" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="434" y="352" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518.0" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">6  re-check eligibility (CR-006)</text>
      <line x1="380" y1="408" x2="120" y2="408" stroke="#bf4520" stroke-width="1.4" marker-end="url(#suggestion-sequence-arrow-accent)"/>
      <rect x="161" y="392" width="178" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250.0" y="401" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">7  200 status ok · items + reasons</text>
      <line x1="388" y1="480" x2="648" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="451" y="464" width="134" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518.0" y="473" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">8  filter discovery (W05)</text>
      <line x1="380" y1="516" x2="120" y2="516" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#suggestion-sequence-arrow)"/>
      <rect x="148" y="500" width="203" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250.0" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">9  200 status fallback · filter results</text>
      <line x1="388" y1="580" x2="648" y2="580" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#suggestion-sequence-arrow-open)"/>
      <rect x="399" y="564" width="237" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518.0" y="573" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">10  trace: ids, tokens, cost, latency (CR-013)</text>
      <rect x="32" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="40" width="176" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
      <rect x="40" y="48" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="56" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="120" y="76" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Browser</text>
      <text x="120" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /api/suggestions</text>
      <rect x="296" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="304" y="48" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="320" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="384" y="76" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Backend</text>
      <text x="384" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">route · ai/suggestions.py</text>
      <rect x="560" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="40" width="176" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="568" y="48" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="584" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="648" y="76" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Postgres</text>
      <text x="648" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">live state · traces</text>
      <rect x="824" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="40" width="176" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="832" y="48" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="848" y="57" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">W07</text>
      <text x="912" y="76" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Suggestion crew</text>
      <text x="912" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 agent · 0 tools → model</text>
      <line x1="40" y1="648" x2="1040" y2="648" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
      <line x1="40" y1="682" x2="68" y2="682" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow-link)"/>
      <text x="76" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">HTTP request</text>
      <line x1="172" y1="682" x2="200" y2="682" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow)"/>
      <text x="208" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Call</text>
      <line x1="264" y1="682" x2="292" y2="682" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#suggestion-sequence-arrow)"/>
      <text x="300" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Return</text>
      <line x1="366" y1="682" x2="394" y2="682" stroke="#bf4520" stroke-width="1.2" marker-end="url(#suggestion-sequence-arrow-accent)"/>
      <text x="402" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Headline success</text>
      <line x1="518" y1="682" x2="546" y2="682" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#suggestion-sequence-arrow-open)"/>
      <text x="554" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Async log write</text>
